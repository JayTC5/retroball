<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retroball Club - Super Edition</title>
<style>
:root {
  --ink: #0a1f16;
  --cream: #f8f0d0;
  --gold: #f4c430;
  --green: #1a6b42;
  --dark-green: #0d3d26;
  --red: #d44a46;
  --blue: #2a5aa0;
  --rare: #5a9bd4;
  --epic: #8b5cf6;
  --legend: #6b21a8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #06140f;
  color: var(--ink);
  font-family: "Courier New", Courier, monospace;
  image-rendering: pixelated;
}
button { font-family: inherit; cursor: pointer; border: none; }
.app {
  max-width: 1200px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--cream);
  border-left: 10px solid #1a2c22;
  border-right: 10px solid #1a2c22;
}
header {
  background: var(--green);
  color: white;
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 6px solid var(--gold);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 50px; height: 50px; background: var(--cream); color: var(--green);
  border: 4px solid white; border-radius: 50%; display: grid; place-items: center;
  font-size: 28px;
}
h1 { margin: 0; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; }
.coins {
  background: var(--dark-green); border: 3px solid white; padding: 8px 16px;
  font-size: 20px; font-weight: bold;
}
nav {
  display: flex; background: var(--ink); padding: 6px; gap: 4px;
}
nav button {
  flex: 1; padding: 12px; background: #2a4a38; color: var(--cream);
  text-transform: uppercase; font-weight: bold; font-size: 14px;
}
nav button.active { background: var(--gold); color: var(--ink); box-shadow: inset 0 -4px #b8860b; }
main { padding: 16px; }
.view { display: none; }
.view.active { display: block; }
.panel {
  border: 4px solid var(--ink);
  background: #fffdf5;
  box-shadow: 6px 6px 0 #c8bc94;
  margin-bottom: 16px;
}
.panel-title {
  background: var(--ink); color: white; padding: 8px 12px;
  font-weight: bold; text-transform: uppercase; font-size: 14px;
}

/* Packs */
.packs {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px; padding: 20px;
}
.pack {
  border: 5px solid var(--ink); background: #e8dcc0; text-align: center;
  padding: 16px; box-shadow: 8px 8px #b8a87a; transition: transform 0.1s;
}
.pack:hover { transform: translate(-3px, -3px); box-shadow: 11px 11px #b8a87a; }
.pack-art {
  height: 180px; display: grid; place-items: center; font-size: 90px;
  border: 4px solid var(--ink); background: #f5ead0; margin-bottom: 12px;
}
.pack.pro .pack-art { background: #d4c0e8; }
.pack.legend .pack-art { background: #f0d070; }
.open-btn {
  width: 100%; padding: 12px; background: var(--green); color: white;
  font-weight: bold; font-size: 16px; border: 3px solid var(--ink);
  box-shadow: 0 4px var(--dark-green);
}
.open-btn:active { transform: translateY(3px); box-shadow: 0 1px var(--dark-green); }

/* Roster */
.roster-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px; padding: 12px;
}
.player-card {
  border: 4px solid var(--ink); padding: 8px; text-align: center;
  background: #f5edd8; box-shadow: 4px 4px #b8ae88; cursor: pointer;
  transition: transform 0.1s;
}
.player-card:hover { transform: translate(-2px, -2px); }
.player-card.common { background: #ddd6bc; }
.player-card.rare { background: #a0d0f0; }
.player-card.epic { background: #c0a0e8; }
.player-card.legendary { background: #7a4ab0; color: white; }
.portrait { font-size: 48px; height: 60px; display: grid; place-items: center; }
.player-name { font-weight: bold; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rating {
  width: 42px; height: 42px; border-radius: 50%; background: var(--gold);
  border: 3px solid var(--ink); margin: 6px auto; display: grid; place-items: center;
  font-weight: bold; font-size: 16px;
}
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 10px; gap: 2px; }
.stats b { display: block; font-size: 12px; }

/* Game */
.game-container { display: grid; grid-template-columns: 1fr 340px; gap: 16px; }
@media (max-width: 900px) { .game-container { grid-template-columns: 1fr; } }
.field-wrap {
  position: relative; background: #2d5a3a; border: 4px solid var(--ink);
  height: 420px; overflow: hidden;
}
canvas#gameCanvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.scoreboard {
  display: grid; grid-template-columns: repeat(5, 1fr); background: var(--ink); color: white;
  text-align: center; font-size: 14px;
}
.scoreboard div { padding: 8px 4px; border-right: 1px solid #333; }
.scoreboard b { display: block; font-size: 18px; }
.game-controls { padding: 12px; }
.game-controls button {
  width: 100%; margin: 6px 0; padding: 14px; background: var(--gold); color: var(--ink);
  font-weight: bold; font-size: 16px; border: 3px solid var(--ink);
}
.game-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
#gameLog {
  height: 180px; overflow-y: auto; border: 3px solid var(--ink);
  background: #fffdf5; padding: 8px; font-size: 12px; margin-top: 8px;
}

/* Reveal */
.reveal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
  place-items: center; z-index: 100;
}
.reveal.show { display: grid; }
.reveal-card {
  width: 320px; min-height: 420px; border: 8px solid white; outline: 6px solid var(--ink);
  padding: 16px; text-align: center; animation: pop 0.5s ease-out;
}
@keyframes pop { from { transform: scale(0.6) rotateY(90deg); } to { transform: scale(1) rotateY(0); } }
.reveal-card .portrait { font-size: 80px; height: 100px; }

/* Toast */
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--ink); color: white; border: 3px solid var(--gold);
  padding: 12px 20px; z-index: 200; transition: transform 0.25s;
}
.toast.show { transform: translateX(-50%) translateY(0); }

.lineup-slots { display: grid; gap: 6px; padding: 8px; }
.line-slot {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px; border-bottom: 2px dashed #aaa; font-size: 13px;
}
.line-slot.starter { background: #e8f5e9; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="brand-mark">⚾</div>
      <h1>Retroball Club</h1>
    </div>
    <div class="coins">$ <span id="coins">500</span></div>
  </header>
  <nav>
    <button class="active" data-view="packs">Packs</button>
    <button data-view="roster">Roster</button>
    <button data-view="lineup">Lineup</button>
    <button data-view="game">Play Ball!</button>
  </nav>
  <main>
    <!-- PACKS -->
    <section id="packs" class="view active">
      <div class="panel">
        <div class="panel-title">Open Packs</div>
        <div class="packs" id="packGrid"></div>
      </div>
    </section>

    <!-- ROSTER -->
    <section id="roster" class="view">
      <div class="panel">
        <div class="panel-title">My Players <span id="rosterCount"></span></div>
        <div class="roster-grid" id="players"></div>
      </div>
    </section>

    <!-- LINEUP -->
    <section id="lineup" class="view">
      <div class="panel">
        <div class="panel-title">Starting Lineup (Team OVR: <span id="teamOvr">--</span>)</div>
        <div class="lineup-slots" id="lineupSlots"></div>
        <p style="padding:8px;font-size:12px;">Click a player in Roster then click a slot to assign. Best 9 by rating auto-fill on new cards.</p>
      </div>
    </section>

    <!-- GAME -->
    <section id="game" class="view">
      <div class="game-container">
        <div>
          <div class="scoreboard">
            <div>INN<br><b id="inning">1</b></div>
            <div>OUT<br><b id="outs">0</b></div>
            <div>B-S<br><b id="count">0-0</b></div>
            <div>RUNS<br><b id="runs">0</b></div>
            <div>OPP<br><b id="oppRuns">0</b></div>
          </div>
          <div class="field-wrap">
            <canvas id="gameCanvas" width="600" height="420"></canvas>
          </div>
        </div>
        <div class="panel">
          <div class="panel-title">At Bat</div>
          <div class="game-controls">
            <div id="currentBatter">Waiting...</div>
            <button id="swingBtn">SWING!</button>
            <button id="takeBtn">TAKE</button>
            <button id="newGameBtn" style="background:#3266a8;color:white;">NEW GAME</button>
          </div>
          <div id="gameLog">Ready to play! Set your lineup first.</div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="reveal" id="reveal">
  <div class="reveal-card" id="revealCard"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const NAMES = ['Ace Walker','Billy Bunts','Carlos Vega','Duke Davis','Eddie Flash','Frank Flint','Gus Green','Harry Horn','Ivy Jones','Jack Slugger','Leo Long','Manny Mound','Nate Nitro','Otto Oak','Pete Power','Ray Rocket','Sam Slam','Tex Turner','Vic Velocity','Will Wright','Zane Zip','Bobby Barrels','Chuck Curve','Danny Dinger','Ellie Ember','Fiona Flame','Gia Gold','Hank Hammer','Ivy Ice','Jade Jet'];
const EMOJIS = ['🏃','🧢','🤾','🧔','👨‍🦰','👱','🧑','👩‍🦰','👨‍🦱','👧'];
const POSITIONS = ['P','C','1B','2B','3B','SS','LF','CF','RF'];

let state = {
  coins: 500,
  roster: [],
  lineup: Array(9).fill(null), // player indices or null
  game: null
};

function load() {
  const saved = localStorage.getItem('retroball-super');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      state.coins = data.coins || 500;
      state.roster = data.roster || [];
      state.lineup = data.lineup || Array(9).fill(null);
    } catch(e) {}
  }
  if (state.roster.length === 0) {
    // starter roster
    state.roster = [
      makePlayer('common'),
      makePlayer('common'),
      makePlayer('rare')
    ];
    autoFillLineup();
  }
  save();
}
function save() {
  localStorage.setItem('retroball-super', JSON.stringify({
    coins: state.coins,
    roster: state.roster,
    lineup: state.lineup
  }));
}

function makePlayer(forcedTier) {
  const roll = Math.random();
  let tier = forcedTier || 'common';
  if (!forcedTier) {
    if (roll < 0.05) tier = 'legendary';
    else if (roll < 0.18) tier = 'epic';
    else if (roll < 0.45) tier = 'rare';
  }
  const base = { legendary: 85, epic: 70, rare: 55, common: 42 }[tier];
  const rating = Math.min(99, base + Math.floor(Math.random() * 14));
  const pos = POSITIONS[Math.floor(Math.random() * POSITIONS.length)];
  return {
    id: Date.now() + Math.random(),
    name: NAMES[Math.floor(Math.random() * NAMES.length)],
    tier,
    rating,
    pos,
    emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)],
    power: Math.min(99, rating - Math.floor(Math.random() * 10)),
    contact: Math.min(99, rating - Math.floor(Math.random() * 8)),
    speed: Math.min(99, rating - Math.floor(Math.random() * 12))
  };
}

function packPlayer(pack) {
  const r = Math.random();
  if (r < pack.legend) return makePlayer('legendary');
  if (r < pack.legend + pack.epic) return makePlayer('epic');
  if (r < pack.legend + pack.epic + pack.rare) return makePlayer('rare');
  return makePlayer('common');
}

const PACKS = [
  { key: 'rookie', name: 'Rookie Pack', price: 100, art: '🎟️', legend: 0.02, epic: 0.08, rare: 0.28 },
  { key: 'pro', name: 'Pro Pack', price: 250, art: '📦', legend: 0.06, epic: 0.18, rare: 0.46 },
  { key: 'legend', name: 'Legend Pack', price: 500, art: '🏆', legend: 0.15, epic: 0.32, rare: 0.53 }
];

function renderPacks() {
  document.getElementById('packGrid').innerHTML = PACKS.map(p => `
    <div class="pack ${p.key}">
      <div class="pack-art">${p.art}</div>
      <h3>${p.name}</h3>
      <p style="font-size:12px;margin:4px 0;">Better odds for higher tiers</p>
      <button class="open-btn" data-pack="${p.key}">$${p.price} · OPEN</button>
    </div>
  `).join('');
}

function renderRoster() {
  const grid = document.getElementById('players');
  grid.innerHTML = state.roster.map((p, i) => `
    <div class="player-card ${p.tier}" data-idx="${i}" onclick="selectForLineup(${i})">
      <div class="portrait">${p.emoji}</div>
      <div class="player-name">${p.name}</div>
      <div class="rating">${p.rating}</div>
      <div class="stats">
        <span>POW<b>${p.power}</b></span>
        <span>CON<b>${p.contact}</b></span>
        <span>SPD<b>${p.speed}</b></span>
      </div>
      <div style="font-size:11px;margin-top:4px;">${p.pos} · ${p.tier.toUpperCase()}</div>
      <button style="margin-top:6px;padding:4px;font-size:11px;background:#c84a46;color:white;width:100%;" onclick="event.stopPropagation();sellPlayer(${i})">SELL $${Math.floor(p.rating * 2)}</button>
    </div>
  `).join('');
  document.getElementById('rosterCount').textContent = `(${state.roster.length})`;
  updateTeamOvr();
}

function renderLineup() {
  const slots = document.getElementById('lineupSlots');
  slots.innerHTML = state.lineup.map((idx, slot) => {
    const p = idx !== null ? state.roster[idx] : null;
    return `
      <div class="line-slot ${p ? 'starter' : ''}" onclick="assignToSlot(${slot})">
        <b>${POSITIONS[slot] || 'BAT' + (slot+1)}</b>
        <span>${p ? p.name + ' (' + p.rating + ')' : 'Empty — click to assign'}</span>
        <span>${p ? p.emoji : '—'}</span>
      </div>
    `;
  }).join('');
  updateTeamOvr();
}

function updateTeamOvr() {
  const starters = state.lineup.filter(i => i !== null).map(i => state.roster[i]);
  const avg = starters.length ? Math.round(starters.reduce((a, p) => a + p.rating, 0) / starters.length) : 0;
  document.getElementById('teamOvr').textContent = avg || '--';
}

let selectedPlayerIdx = null;
function selectForLineup(idx) {
  selectedPlayerIdx = idx;
  toast('Selected ' + state.roster[idx].name + ' — now click a lineup slot');
}

function assignToSlot(slot) {
  if (selectedPlayerIdx === null) {
    toast('First select a player from Roster');
    return;
  }
  // remove from other slots
  state.lineup = state.lineup.map(i => i === selectedPlayerIdx ? null : i);
  state.lineup[slot] = selectedPlayerIdx;
  selectedPlayerIdx = null;
  renderLineup();
  save();
  toast('Lineup updated!');
}

function autoFillLineup() {
  const sorted = [...state.roster].map((p, i) => ({p, i})).sort((a, b) => b.p.rating - a.p.rating);
  state.lineup = sorted.slice(0, 9).map(x => x.i);
  while (state.lineup.length < 9) state.lineup.push(null);
}

function sellPlayer(idx) {
  const p = state.roster[idx];
  if (!confirm(`Sell ${p.name} for $${Math.floor(p.rating * 2)}?`)) return;
  state.coins += Math.floor(p.rating * 2);
  // remove from lineup
  state.lineup = state.lineup.map(i => i === idx ? null : (i > idx ? i - 1 : i));
  state.roster.splice(idx, 1);
  save();
  updateCoins();
  renderRoster();
  renderLineup();
  toast(`Sold for $${Math.floor(p.rating * 2)}`);
}

function updateCoins() {
  document.getElementById('coins').textContent = state.coins;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// Pack opening
document.getElementById('packGrid').addEventListener('click', e => {
  const btn = e.target.closest('[data-pack]');
  if (!btn) return;
  const pack = PACKS.find(p => p.key === btn.dataset.pack);
  if (state.coins < pack.price) {
    toast('Not enough coins!');
    return;
  }
  state.coins -= pack.price;
  updateCoins();
  const player = packPlayer(pack);
  state.roster.push(player);
  if (state.lineup.filter(Boolean).length < 9) autoFillLineup();
  save();
  showReveal(player);
  renderRoster();
  renderLineup();
});

function showReveal(player) {
  const card = document.getElementById('revealCard');
  card.className = `reveal-card ${player.tier}`;
  card.innerHTML = `
    <div style="text-transform:uppercase;font-weight:bold;font-size:14px;">${player.tier} · ${player.pos}</div>
    <div class="portrait">${player.emoji}</div>
    <h2 style="margin:8px 0 4px;">${player.name}</h2>
    <div class="rating" style="width:60px;height:60px;font-size:24px;">${player.rating}</div>
    <div class="stats" style="margin:12px 0;">
      <span>POW<b>${player.power}</b></span>
      <span>CON<b>${player.contact}</b></span>
      <span>SPD<b>${player.speed}</b></span>
    </div>
    <button class="open-btn" id="keepBtn">ADD TO ROSTER</button>
  `;
  document.getElementById('reveal').classList.add('show');
  document.getElementById('keepBtn').onclick = () => {
    document.getElementById('reveal').classList.remove('show');
  };
}

// Navigation
document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(btn.dataset.view).classList.add('active');
    if (btn.dataset.view === 'game') initGameView();
  };
});

// ========== GAME ==========
let canvas, ctx;
let gameState = null;

function initGameView() {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  drawField();
  if (!gameState) newGame();
}

function drawField() {
  if (!ctx) return;
  ctx.fillStyle = '#2d5a3a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // dirt
  ctx.fillStyle = '#8b6914';
  ctx.beginPath();
  ctx.moveTo(300, 380);
  ctx.lineTo(180, 220);
  ctx.lineTo(300, 80);
  ctx.lineTo(420, 220);
  ctx.closePath();
  ctx.fill();
  // bases
  ctx.fillStyle = '#fff';
  [[300, 360], [220, 260], [300, 140], [380, 260]].forEach(([x, y]) => {
    ctx.fillRect(x - 10, y - 10, 20, 20);
  });
  // mound
  ctx.fillStyle = '#a67c52';
  ctx.beginPath();
  ctx.arc(300, 240, 18, 0, Math.PI * 2);
  ctx.fill();
  // home plate area
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeRect(270, 340, 60, 40);
}

function newGame() {
  const teamOvr = parseInt(document.getElementById('teamOvr').textContent) || 60;
  gameState = {
    inning: 1,
    outs: 0,
    balls: 0,
    strikes: 0,
    runs: 0,
    oppRuns: 0,
    bases: [null, null, null], // 1st, 2nd, 3rd
    batterIndex: 0,
    pitching: false,
    ball: null,
    message: 'Play ball! Swing or Take.'
  };
  log('New game started! Team OVR ' + teamOvr);
  updateGameUI();
  drawField();
}

function getCurrentBatter() {
  const starters = state.lineup.filter(i => i !== null).map(i => state.roster[i]);
  if (!starters.length) return null;
  return starters[gameState.batterIndex % starters.length];
}

function updateGameUI() {
  if (!gameState) return;
  document.getElementById('inning').textContent = gameState.inning;
  document.getElementById('outs').textContent = gameState.outs;
  document.getElementById('count').textContent = gameState.balls + '-' + gameState.strikes;
  document.getElementById('runs').textContent = gameState.runs;
  document.getElementById('oppRuns').textContent = gameState.oppRuns;
  const batter = getCurrentBatter();
  document.getElementById('currentBatter').innerHTML = batter
    ? `${batter.emoji} <b>${batter.name}</b> (${batter.rating}) · ${batter.pos}`
    : 'No lineup set!';
  document.getElementById('swingBtn').disabled = gameState.pitching || !batter;
  document.getElementById('takeBtn').disabled = gameState.pitching || !batter;
}

function log(msg) {
  const el = document.getElementById('gameLog');
  el.innerHTML += `<div><b>${msg}</b></div>`;
  el.scrollTop = el.scrollHeight;
}

function pitch() {
  if (gameState.pitching || !getCurrentBatter()) return;
  gameState.pitching = true;
  updateGameUI();
  // simple pitch animation
  gameState.ball = { x: 300, y: 240, vx: 0, vy: 4, life: 0 };
  animatePitch();
}

function animatePitch() {
  if (!gameState.ball) return;
  const b = gameState.ball;
  b.y += b.vy;
  b.life++;
  drawField();
  // draw ball
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.stroke();
  // strike zone highlight when close
  if (b.y > 320 && b.y < 380) {
    ctx.strokeStyle = 'rgba(255,255,0,0.6)';
    ctx.lineWidth = 4;
    ctx.strokeRect(265, 335, 70, 50);
  }
  if (b.y < 400 && b.life < 80) {
    requestAnimationFrame(animatePitch);
  } else {
    // pitch arrived
    gameState.pitching = false;
    gameState.ball = null;
    resolvePitch(false); // auto take if no swing
  }
}

document.getElementById('swingBtn').onclick = () => {
  if (gameState.pitching) {
    // timing check
    const b = gameState.ball;
    const inZone = b && b.y > 330 && b.y < 370;
    resolvePitch(true, inZone);
  } else {
    pitch();
    // start listening for swing
  }
};

document.getElementById('takeBtn').onclick = () => {
  pitch();
  setTimeout(() => {
    if (gameState.pitching) {
      gameState.pitching = false;
      gameState.ball = null;
      resolvePitch(false);
    }
  }, 900);
};

document.getElementById('newGameBtn').onclick = newGame;

function resolvePitch(swung, goodTiming = false) {
  gameState.pitching = false;
  gameState.ball = null;
  const batter = getCurrentBatter();
  if (!batter) return;

  const inZone = Math.random() < 0.68;
  const contact = batter.contact / 100;
  const power = batter.power / 100;

  if (!swung) {
    if (!inZone) {
      gameState.balls++;
      log('Ball!');
      if (gameState.balls >= 4) {
        log('Walk! Batter to first.');
        advanceRunners(1);
        nextBatter();
      }
    } else {
      gameState.strikes++;
      log('Called strike!');
      if (gameState.strikes >= 3) {
        log('Strikeout!');
        gameState.outs++;
        nextBatter();
      }
    }
  } else {
    // swing
    const timingBonus = goodTiming ? 0.35 : 0;
    const hitChance = contact * (inZone ? 0.75 : 0.35) + timingBonus;
    if (Math.random() < hitChance) {
      const hitRoll = Math.random() + power * 0.3;
      let bases = 1;
      let msg = 'Single!';
      if (hitRoll > 0.92) { bases = 4; msg = 'HOME RUN!!!'; }
      else if (hitRoll > 0.78) { bases = 3; msg = 'Triple!'; }
      else if (hitRoll > 0.55) { bases = 2; msg = 'Double!'; }
      log(msg);
      advanceRunners(bases);
      nextBatter();
    } else {
      gameState.strikes++;
      log(goodTiming ? 'Foul tip!' : 'Swing and a miss!');
      if (gameState.strikes >= 3) {
        log('Strikeout!');
        gameState.outs++;
        nextBatter();
      }
    }
  }
  checkInning();
  updateGameUI();
  drawField();
  save();
}

function advanceRunners(bases) {
  // simple advance
  for (let i = 0; i < bases; i++) {
    // move existing
    if (gameState.bases[2]) { gameState.runs++; log('Run scores!'); }
    gameState.bases[2] = gameState.bases[1];
    gameState.bases[1] = gameState.bases[0];
    gameState.bases[0] = true;
  }
  // clear if HR
  if (bases >= 4) {
    gameState.runs += gameState.bases.filter(Boolean).length + 1;
    gameState.bases = [null, null, null];
    log('All runners score!');
  }
}

function nextBatter() {
  gameState.batterIndex++;
  gameState.balls = 0;
  gameState.strikes = 0;
}

function checkInning() {
  if (gameState.outs >= 3) {
    gameState.outs = 0;
    gameState.inning++;
    gameState.bases = [null, null, null];
    // simple opponent scoring
    const teamOvr = parseInt(document.getElementById('teamOvr').textContent) || 60;
    const oppScore = Math.random() < (0.4 - (teamOvr - 60) * 0.005) ? Math.floor(Math.random() * 3) : 0;
    gameState.oppRuns += oppScore;
    if (oppScore) log(`Opponent scores ${oppScore}!`);
    log(`End of inning. Score: ${gameState.runs}-${gameState.oppRuns}`);
    if (gameState.inning > 3) {
      endGame();
    }
  }
}

function endGame() {
  const win = gameState.runs > gameState.oppRuns;
  const reward = win ? 80 + gameState.runs * 10 : 20;
  state.coins += reward;
  updateCoins();
  log(win ? `YOU WIN! +$${reward}` : `You lost. +$${reward} consolation`);
  toast(win ? 'Victory!' : 'Better luck next time');
  gameState = null;
  save();
}

// Init
load();
renderPacks();
renderRoster();
renderLineup();
updateCoins();
</script>

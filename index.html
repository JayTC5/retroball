<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RETROBALL Derby</title>
<style>
* { box-sizing: border-box; image-rendering: pixelated; }
body {
  margin: 0;
  min-height: 100vh;
  background: #06140f;
  color: #f8f0d0;
  font-family: "Courier New", monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
h1 { margin: 8px 0; font-size: 28px; letter-spacing: 3px; color: #f4c430; }
.scoreboard {
  display: flex;
  gap: 16px;
  background: #0d3d26;
  border: 4px solid #f4c430;
  padding: 8px 16px;
  margin-bottom: 8px;
  font-size: 15px;
  text-align: center;
}
.scoreboard b { color: #f4c430; font-size: 22px; }
.field-wrap {
  position: relative;
  border: 6px solid #1a2c22;
  background: #2d5a3a;
  cursor: pointer;
  box-shadow: 0 0 0 4px #f4c430;
}
canvas { display: block; }
.tap-hint {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85);
  color: white;
  padding: 8px 16px;
  font-size: 16px;
  font-weight: bold;
  border: 3px solid #f4c430;
  pointer-events: none;
  text-align: center;
}
.next-pitch {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 4px 12px;
  font-size: 14px;
  font-weight: bold;
  border: 2px solid #fff;
  pointer-events: none;
}
.info {
  margin-top: 8px;
  text-align: center;
  font-size: 13px;
  max-width: 640px;
}
.pitch-legend {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 6px;
  flex-wrap: wrap;
  font-size: 12px;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.swatch { width: 14px; height: 14px; border: 2px solid #fff; }
button {
  margin-top: 8px;
  padding: 8px 18px;
  background: #f4c430;
  color: #0a1f16;
  font-weight: bold;
  font-size: 15px;
  border: 3px solid #0a1f16;
  cursor: pointer;
  font-family: inherit;
}
button:active { transform: translateY(2px); }
</style>
</head>
<body>
<h1>RETROBALL DERBY</h1>
<div class="scoreboard">
  <div>HOME RUNS<br><b id="hrs">0</b></div>
  <div>OUTS<br><b id="outs">0</b></div>
  <div>COINS<br><b id="coins">0</b></div>
  <div>BEST<br><b id="best">0</b></div>
  <div>LAST HR<br><b id="lastDist">--</b></div>
</div>
<div class="field-wrap" id="fieldWrap">
  <canvas id="c" width="640" height="440"></canvas>
  <div class="next-pitch" id="nextPitch">NEXT: WHITE (Fastball)</div>
  <div class="tap-hint" id="hint">TAP / SPACE TO PITCH</div>
</div>
<div class="info">Tap the field or press SPACE to pitch, then tap or SPACE again to swing. Only balls over the fence are home runs.</div>
<div class="pitch-legend">
  <div class="legend-item"><div class="swatch" style="background:#eee;"></div> White: Fastball</div>
  <div class="legend-item"><div class="swatch" style="background:#e33;"></div> Red: SUPER FAST</div>
  <div class="legend-item"><div class="swatch" style="background:#fc0;"></div> Yellow: Slider</div>
</div>
<button onclick="resetGame()">NEW ROUND</button>
<button onclick="openShop()" style="background:#2a5aa0;color:white;">SHOP</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
const nextPitchEl = document.getElementById('nextPitch');

let hrs = 0, pitches = 0, best = parseInt(localStorage.getItem('retroball-best')||0), outs = 0;
let coins = parseInt(localStorage.getItem('retroball-coins')||0);
let lastDist = 0;
let phase = 'idle';
let nextPitchType = 'white';
let anim = { arm: 0, swing: 0, ball: null, hit: null };
let animId = null;

// Realistic pitches only
const PITCHES = {
  white:  { name: 'Fastball',    color: '#eeeeee', speed: 1.0,  curve: 0,   drop: 0.15 },
  red:    { name: 'SUPER FAST',  color: '#ee3333', speed: 1.65, curve: 0,   drop: 0.08 },
  yellow: { name: 'Slider',      color: '#ffcc00', speed: 1.05, curve: 1.8, drop: 0.25 }
};

// Harder fence distances
const FENCE = { left: 370, center: 410, right: 380 };

function pickPitch() {
  const r = Math.random();
  if (r < 0.45) return 'white';
  if (r < 0.75) return 'red';
  return 'yellow';
}

function updateNextPitchDisplay() {
  const p = PITCHES[nextPitchType];
  nextPitchEl.textContent = 'NEXT: ' + nextPitchType.toUpperCase() + ' (' + p.name + ')';
  nextPitchEl.style.borderColor = p.color;
}

function updateScore() {
  document.getElementById('hrs').textContent = hrs;
  document.getElementById('outs').textContent = outs;
  document.getElementById('coins').textContent = coins;
  document.getElementById('best').textContent = best;
  document.getElementById('lastDist').textContent = lastDist ? lastDist + ' ft' : '--';
  if (hrs > best) {
    best = hrs;
    localStorage.setItem('retroball-best', best);
  }
  localStorage.setItem('retroball-coins', coins);
}

function drawPixel(x, y, color, arm, isPitcher) {
  ctx.fillStyle = isPitcher ? color : '#c84a46';
  ctx.fillRect(x - 7, y - 18, 14, 20);
  ctx.fillStyle = '#f4c28a';
  ctx.fillRect(x - 6, y - 28, 12, 11);
  ctx.fillStyle = isPitcher ? '#222' : '#a33';
  ctx.fillRect(x - 7, y - 30, 14, 4);
  ctx.strokeStyle = isPitcher ? '#222' : '#8b4513';
  ctx.lineWidth = isPitcher ? 3 : 5;
  ctx.beginPath();
  ctx.moveTo(x + (isPitcher ? 7 : -7), y - 12);
  const ang = isPitcher ? (arm * Math.PI * 1.2 - 1) : (-1.2 + arm * 2.6);
  const len = isPitcher ? 16 : 20;
  ctx.lineTo(x + Math.cos(ang) * len, y - 10 + Math.sin(ang) * 12);
  ctx.stroke();
}

function draw() {
  const w = canvas.width, h = canvas.height;
  // field
  ctx.fillStyle = '#2d5a3a';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#266b40';
  for (let y = 0; y < h; y += 14) ctx.fillRect(0, y, w, 7);

  // CURVY FENCE
  ctx.fillStyle = '#3a2a1a';
  ctx.beginPath();
  ctx.moveTo(20, 70);
  ctx.quadraticCurveTo(w/2, 28, w - 20, 70);
  ctx.lineTo(w - 20, 92);
  ctx.quadraticCurveTo(w/2, 50, 20, 92);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#5a3a22';
  ctx.beginPath();
  ctx.moveTo(20, 70);
  ctx.quadraticCurveTo(w/2, 28, w - 20, 70);
  ctx.lineTo(w - 20, 78);
  ctx.quadraticCurveTo(w/2, 36, 20, 78);
  ctx.closePath();
  ctx.fill();
  // fence posts along the curve
  ctx.fillStyle = '#222';
  for (let i = 0; i <= 18; i++) {
    const t = i / 18;
    const x = 20 + t * (w - 40);
    const y = 70 + (t - 0.5) * (t - 0.5) * 80 - 20;
    ctx.fillRect(x - 1.5, y, 3, 24);
  }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('370', w/2 - 150, 62);
  ctx.fillText('410', w/2, 48);
  ctx.fillText('380', w/2 + 150, 62);

  // dirt infield
  ctx.fillStyle = '#8b6914';
  ctx.beginPath();
  ctx.moveTo(w/2, h - 8);
  ctx.lineTo(w/2 - 155, h/2 + 55);
  ctx.lineTo(w/2, 95);
  ctx.lineTo(w/2 + 155, h/2 + 55);
  ctx.closePath();
  ctx.fill();

  // bases
  ctx.fillStyle = '#fff';
  [[w/2, h-38], [w/2-125, h/2+35], [w/2, 125], [w/2+125, h/2+35]].forEach(([x,y]) => {
    ctx.fillRect(x-8, y-8, 16, 16);
  });

  // mound
  ctx.fillStyle = '#a67c52';
  ctx.beginPath();
  ctx.arc(w/2, h/2 + 35, 18, 0, Math.PI*2);
  ctx.fill();

  // home plate
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeRect(w/2-32, h-90, 64, 38);

  // pitcher (shows NEXT pitch color)
  const pColor = PITCHES[nextPitchType].color;
  drawPixel(w/2, h/2 + 22, pColor, anim.arm, true);

  // batter
  drawPixel(w/2 + 26, h - 70, '#c84a46', anim.swing, false);

  // ball in flight
  if (anim.ball) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(anim.ball.x, anim.ball.y, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  if (anim.hit) {
    ctx.fillStyle = '#ffee55';
    ctx.beginPath();
    ctx.arc(anim.hit.x, anim.hit.y, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.stroke();
  }

  // crowd
  ctx.fillStyle = '#1a3a28';
  ctx.fillRect(0, 0, w, 36);
  for (let i = 0; i < 90; i++) {
    ctx.fillStyle = ['#e44','#4ae','#fe4','#fff','#a4e'][i%5];
    ctx.fillRect((i * 7) % w, 8 + (i % 4) * 6, 3, 3);
  }
}

function onAction() {
  if (phase === 'idle') startPitch();
  else if (phase === 'pitching') swing();
}

canvas.onclick = onAction;
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    onAction();
  }
});

function startPitch() {
  if (phase !== 'idle') return;
  phase = 'pitching';
  pitches++;
  const currentType = nextPitchType;
  const p = PITCHES[currentType];
  anim.arm = 0;
  anim.swing = 0;
  anim.ball = {
    x: canvas.width / 2,
    y: canvas.height / 2 + 22,
    speed: 2.8 * p.speed,
    curve: p.curve,
    drop: p.drop,
    t: 0,
    type: currentType
  };
  anim.hit = null;
  hint.textContent = 'TAP / SPACE TO SWING';
  updateScore();
  animate();
}

function animate() {
  if (phase !== 'pitching') return;
  anim.arm = Math.min(1, anim.arm + 0.06);
  if (anim.ball) {
    const b = anim.ball;
    b.t += 1;
    b.y += b.speed;
    b.speed += b.drop * 0.12;
    if (b.curve) b.x += Math.sin(b.t * 0.12) * b.curve * 1.4;
  }
  draw();
  if (anim.ball && anim.ball.y < canvas.height - 80) {
    animId = requestAnimationFrame(animate);
  } else if (phase === 'pitching') {
    setTimeout(() => { if (phase === 'pitching') resolve(false); }, 80);
  }
}

function swing() {
  if (phase !== 'pitching') return;
  resolve(true);
}

function resolve(swung) {
  if (phase !== 'pitching') return;
  phase = 'resolving';
  if (animId) cancelAnimationFrame(animId);

  const ball = anim.ball;
  const ballY = ball ? ball.y : 0;
  // Sweet spot around 310-340 for good contact
  const sweetSpot = 325;
  const timingError = Math.abs(ballY - sweetSpot);

  if (swung) {
    anim.swing = 0;
    let s = 0;
    const doSwing = () => {
      s++;
      anim.swing = Math.min(1, s * 0.16);
      draw();
      if (s < 8) requestAnimationFrame(doSwing);
    };
    doSwing();
  }

  const inZone = ball && Math.abs(ball.x - canvas.width/2) < 38 && ballY > 280 && ballY < 360;
  const timingQuality = Math.max(0, 1 - timingError / 55);

  if (!swung) {
    outs++;
    logMsg('Out!');
  } else if (inZone && timingQuality > 0.45) {
    // Harder exit velocity
    const exitVelo = 82 + timingQuality * 38;
    const pull = (ball.x - canvas.width/2) / 40;
    const launchAngle = 16 + timingQuality * 12 + (Math.random()-0.5)*4;

    const dist = Math.round(exitVelo * 2.6 + launchAngle * 1.4 + (Math.random()-0.5)*18);
    const clampedDist = Math.max(280, Math.min(460, dist));

    // Determine fence based on direction
    let fenceDist = FENCE.center;
    if (pull < -0.35) fenceDist = FENCE.left;
    else if (pull > 0.35) fenceDist = FENCE.right;

    const isHR = clampedDist >= fenceDist;

    if (isHR) {
      hrs++;
      lastDist = clampedDist;
      const coinReward = Math.floor(clampedDist / 10) + 15;
      coins += coinReward;
      logMsg('HOME RUN! ' + clampedDist + ' ft (+' + coinReward + ' coins)');
      // Ball flies OVER the fence
      anim.hit = {
        x: canvas.width / 2 + pull * 15,
        y: canvas.height - 70,
        vx: pull * 1.8,
        vy: -11 - timingQuality * 4,
        overFence: true
      };
    } else {
      outs++;
      lastDist = 0;
      logMsg('Out! (' + clampedDist + ' ft)');
      anim.hit = {
        x: canvas.width / 2 + pull * 20,
        y: canvas.height - 70,
        vx: pull * 3,
        vy: -4.5 - timingQuality * 2,
        overFence: false
      };
    }

    // Fly ball animation
    let f = 0;
    const fly = () => {
      if (!anim.hit) return;
      anim.hit.x += anim.hit.vx;
      anim.hit.y += anim.hit.vy;
      anim.hit.vy += 0.18;
      f++;
      draw();
      // Keep HR balls flying until they clearly go past the fence
      if (anim.hit.overFence && anim.hit.y > 40) {
        anim.hit.vy = Math.min(anim.hit.vy, -2);
      }
      if (f < 90 && anim.hit.y > -20) requestAnimationFrame(fly);
      else anim.hit = null;
    };
    fly();
  } else {
    outs++;
    logMsg('Out!');
  }

  // Check for 3 outs
  if (outs >= 3) {
    setTimeout(() => {
      alert('3 outs! Round over. You hit ' + hrs + ' home runs.');
      resetRound();
    }, 800);
  }

  // Change to next pitch NOW (before next pitch)
  nextPitchType = pickPitch();
  updateNextPitchDisplay();

  anim.ball = null;
  updateScore();
  setTimeout(() => {
    phase = 'idle';
    hint.textContent = 'TAP / SPACE TO PITCH';
    draw();
  }, 650);
}

function logMsg(msg) {
  const old = hint.textContent;
  hint.textContent = msg;
  setTimeout(() => { if (phase !== 'idle') hint.textContent = old; }, 1000);
}

function resetRound() {
  hrs = 0;
  pitches = 0;
  outs = 0;
  lastDist = 0;
  phase = 'idle';
  nextPitchType = pickPitch();
  anim = { arm: 0, swing: 0, ball: null, hit: null };
  if (animId) cancelAnimationFrame(animId);
  updateNextPitchDisplay();
  updateScore();
  hint.textContent = 'TAP / SPACE TO PITCH';
  draw();
}

function resetGame() {
  resetRound();
}

function openShop() {
  alert('SHOP\\n\\nComing Soon!\\n\\nNew hitters will be available here.');
}

// init
nextPitchType = pickPitch();
updateNextPitchDisplay();
updateScore();
draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RETROBALL Derby</title>
<style>
* { box-sizing: border-box; image-rendering: pixelated; }
body {
  margin: 0;
  min-height: 100vh;
  background: #06140f;
  color: #f8f0d0;
  font-family: "Courier New", monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
h1 { margin: 8px 0; font-size: 28px; letter-spacing: 3px; color: #f4c430; }
.scoreboard {
  display: flex;
  gap: 16px;
  background: #0d3d26;
  border: 4px solid #f4c430;
  padding: 8px 16px;
  margin-bottom: 8px;
  font-size: 15px;
  text-align: center;
}
.scoreboard b { color: #f4c430; font-size: 22px; }
.field-wrap {
  position: relative;
  border: 6px solid #1a2c22;
  background: #2d5a3a;
  cursor: pointer;
  box-shadow: 0 0 0 4px #f4c430;
}
canvas { display: block; }
.tap-hint {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85);
  color: white;
  padding: 8px 16px;
  font-size: 16px;
  font-weight: bold;
  border: 3px solid #f4c430;
  pointer-events: none;
  text-align: center;
}
.next-pitch {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 4px 12px;
  font-size: 14px;
  font-weight: bold;
  border: 2px solid #fff;
  pointer-events: none;
}
.info {
  margin-top: 8px;
  text-align: center;
  font-size: 13px;
  max-width: 640px;
}
.pitch-legend {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 6px;
  flex-wrap: wrap;
  font-size: 12px;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.swatch { width: 14px; height: 14px; border: 2px solid #fff; }
button {
  margin-top: 8px;
  padding: 8px 18px;
  background: #f4c430;
  color: #0a1f16;
  font-weight: bold;
  font-size: 15px;
  border: 3px solid #0a1f16;
  cursor: pointer;
  font-family: inherit;
}
button:active { transform: translateY(2px); }
</style>
</head>
<body>
<h1>RETROBALL DERBY</h1>
<div class="scoreboard">
  <div>HOME RUNS<br><b id="hrs">0</b></div>
  <div>PITCHES<br><b id="pitches">0</b></div>
  <div>BEST<br><b id="best">0</b></div>
  <div>STREAK<br><b id="streak">0</b></div>
  <div>LAST HR<br><b id="lastDist">--</b></div>
</div>
<div class="field-wrap" id="fieldWrap">
  <canvas id="c" width="640" height="440"></canvas>
  <div class="next-pitch" id="nextPitch">NEXT: WHITE (Normal)</div>
  <div class="tap-hint" id="hint">TAP TO PITCH</div>
</div>
<div class="info">Tap the field to pitch, then tap again to swing. Watch the pitcher color!</div>
<div class="pitch-legend">
  <div class="legend-item"><div class="swatch" style="background:#eee;"></div> White: Normal</div>
  <div class="legend-item"><div class="swatch" style="background:#e33;"></div> Red: SUPER FAST</div>
  <div class="legend-item"><div class="swatch" style="background:#39f;"></div> Blue: Loop ball</div>
  <div class="legend-item"><div class="swatch" style="background:#fc0;"></div> Yellow: Slider</div>
  <div class="legend-item"><div class="swatch" style="background:linear-gradient(90deg,#f33,#ff3,#3f3,#39f);"></div> Rainbow: ANYTHING</div>
</div>
<button onclick="resetGame()">RESET</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
const nextPitchEl = document.getElementById('nextPitch');

let hrs = 0, pitches = 0, best = parseInt(localStorage.getItem('retroball-best')||0), streak = 0;
let lastDist = 0;
let phase = 'idle';
let nextPitchType = 'white';
let anim = { arm: 0, swing: 0, ball: null, hit: null };
let animId = null;

const PITCHES = {
  white:  { name: 'Normal',     color: '#eeeeee', speed: 1.0, curve: 0,   loop: 0 },
  red:    { name: 'SUPER FAST', color: '#ee3333', speed: 1.9, curve: 0,   loop: 0 },
  blue:   { name: 'Loop ball',  color: '#3399ff', speed: 0.7, curve: 0,   loop: 1 },
  yellow: { name: 'Slider',     color: '#ffcc00', speed: 1.15, curve: 1.6, loop: 0 },
  rainbow:{ name: 'ANYTHING',   color: 'rainbow', speed: 1.35, curve: 0.9, loop: 0.6 }
};

function pickPitch() {
  const r = Math.random();
  if (r < 0.35) return 'white';
  if (r < 0.55) return 'red';
  if (r < 0.75) return 'blue';
  if (r < 0.90) return 'yellow';
  return 'rainbow';
}

function updateNextPitchDisplay() {
  const p = PITCHES[nextPitchType];
  nextPitchEl.textContent = 'NEXT: ' + nextPitchType.toUpperCase() + ' (' + p.name + ')';
  nextPitchEl.style.borderColor = nextPitchType === 'rainbow' ? '#f3f' : p.color;
}

function updateScore() {
  document.getElementById('hrs').textContent = hrs;
  document.getElementById('pitches').textContent = pitches;
  document.getElementById('best').textContent = best;
  document.getElementById('streak').textContent = streak;
  document.getElementById('lastDist').textContent = lastDist ? lastDist + ' ft' : '--';
  if (hrs > best) {
    best = hrs;
    localStorage.setItem('retroball-best', best);
  }
}

function drawPixel(x, y, color, arm, isPitcher) {
  if (isPitcher && color === 'rainbow') {
    const grd = ctx.createLinearGradient(x-8, y-20, x+8, y+10);
    grd.addColorStop(0, '#f33');
    grd.addColorStop(0.25, '#f93');
    grd.addColorStop(0.5, '#ff3');
    grd.addColorStop(0.75, '#3f3');
    grd.addColorStop(1, '#39f');
    ctx.fillStyle = grd;
  } else {
    ctx.fillStyle = isPitcher ? color : '#c84a46';
  }
  ctx.fillRect(x - 7, y - 18, 14, 20);
  ctx.fillStyle = '#f4c28a';
  ctx.fillRect(x - 6, y - 28, 12, 11);
  ctx.fillStyle = isPitcher ? '#222' : '#a33';
  ctx.fillRect(x - 7, y - 30, 14, 4);
  ctx.strokeStyle = isPitcher ? '#222' : '#8b4513';
  ctx.lineWidth = isPitcher ? 3 : 5;
  ctx.beginPath();
  ctx.moveTo(x + (isPitcher ? 7 : -7), y - 12);
  const ang = isPitcher ? (arm * Math.PI * 1.2 - 1) : (-1.2 + arm * 2.6);
  const len = isPitcher ? 16 : 20;
  ctx.lineTo(x + Math.cos(ang) * len, y - 10 + Math.sin(ang) * 12);
  ctx.stroke();
}

function draw() {
  const w = canvas.width, h = canvas.height;
  // field
  ctx.fillStyle = '#2d5a3a';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#266b40';
  for (let y = 0; y < h; y += 14) ctx.fillRect(0, y, w, 7);

  // FENCE (outfield wall)
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(40, 48, w - 80, 18);
  ctx.fillStyle = '#5a3a22';
  ctx.fillRect(40, 48, w - 80, 6);
  // fence posts
  ctx.fillStyle = '#222';
  for (let x = 50; x < w - 40; x += 28) {
    ctx.fillRect(x, 48, 3, 22);
  }
  // fence height markers
  ctx.fillStyle = '#fff';
  ctx.font = '10px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('350', w/2 - 140, 62);
  ctx.fillText('400', w/2, 62);
  ctx.fillText('450', w/2 + 140, 62);

  // dirt
  ctx.fillStyle = '#8b6914';
  ctx.beginPath();
  ctx.moveTo(w/2, h - 10);
  ctx.lineTo(w/2 - 150, h/2 + 50);
  ctx.lineTo(w/2, 90);
  ctx.lineTo(w/2 + 150, h/2 + 50);
  ctx.closePath();
  ctx.fill();

  // bases
  ctx.fillStyle = '#fff';
  [[w/2, h-40], [w/2-120, h/2+30], [w/2, 120], [w/2+120, h/2+30]].forEach(([x,y]) => {
    ctx.fillRect(x-8, y-8, 16, 16);
  });

  // mound
  ctx.fillStyle = '#a67c52';
  ctx.beginPath();
  ctx.arc(w/2, h/2 + 30, 18, 0, Math.PI*2);
  ctx.fill();

  // home plate
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeRect(w/2-30, h-85, 60, 36);

  // pitcher (uses NEXT pitch color so you see it before pitching)
  const pColor = PITCHES[nextPitchType].color;
  drawPixel(w/2, h/2 + 18, pColor, anim.arm, true);

  // batter
  drawPixel(w/2 + 24, h - 65, '#c84a46', anim.swing, false);

  // ball
  if (anim.ball) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(anim.ball.x, anim.ball.y, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  if (anim.hit) {
    ctx.fillStyle = '#ff0';
    ctx.beginPath();
    ctx.arc(anim.hit.x, anim.hit.y, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.stroke();
  }

  // crowd
  ctx.fillStyle = '#1a3a28';
  ctx.fillRect(0, 0, w, 40);
  for (let i = 0; i < 80; i++) {
    ctx.fillStyle = ['#e44','#4ae','#fe4','#fff','#a4e'][i%5];
    ctx.fillRect((i * 8) % w, 8 + (i % 4) * 7, 3, 3);
  }
}

function onTap() {
  if (phase === 'idle') startPitch();
  else if (phase === 'pitching') swing();
}

canvas.onclick = onTap;

function startPitch() {
  if (phase !== 'idle') return;
  phase = 'pitching';
  pitches++;
  const currentType = nextPitchType;
  const p = PITCHES[currentType];
  anim.arm = 0;
  anim.swing = 0;
  anim.ball = {
    x: canvas.width / 2,
    y: canvas.height / 2 + 18,
    speed: 3.0 * p.speed,
    curve: p.curve,
    loop: p.loop,
    t: 0,
    type: currentType
  };
  anim.hit = null;
  hint.textContent = 'TAP TO SWING!';
  updateScore();
  animate();
}

function animate() {
  if (phase !== 'pitching') return;
  anim.arm = Math.min(1, anim.arm + 0.07);
  if (anim.ball) {
    const b = anim.ball;
    b.t += 1;
    b.y += b.speed;
    b.speed += 0.07;
    if (b.curve) b.x += Math.sin(b.t * 0.14) * b.curve * 1.7;
    if (b.loop) b.y += Math.sin(b.t * 0.22) * b.loop * 5.5;
    if (b.type === 'rainbow') {
      b.x += (Math.random() - 0.5) * 4.5;
      b.speed += (Math.random() - 0.5) * 0.45;
    }
  }
  draw();
  if (anim.ball && anim.ball.y < canvas.height - 75) {
    animId = requestAnimationFrame(animate);
  } else if (phase === 'pitching') {
    setTimeout(() => { if (phase === 'pitching') resolve(false); }, 100);
  }
}

function swing() {
  if (phase !== 'pitching') return;
  resolve(true);
}

function resolve(swung) {
  if (phase !== 'pitching') return;
  phase = 'resolving';
  if (animId) cancelAnimationFrame(animId);

  const ballY = anim.ball ? anim.ball.y : 0;
  const sweetSpot = 300; // ideal y for perfect timing
  const timingError = Math.abs(ballY - sweetSpot);
  const timingQuality = Math.max(0, 1 - timingError / 120); // 0 to 1

  if (swung) {
    anim.swing = 0;
    let s = 0;
    const doSwing = () => {
      s++;
      anim.swing = Math.min(1, s * 0.18);
      draw();
      if (s < 7) requestAnimationFrame(doSwing);
    };
    doSwing();
  }

  const currentType = anim.ball ? anim.ball.type : nextPitchType;
  const inZone = Math.random() < (currentType === 'rainbow' ? 0.48 : 0.66);

  if (!swung) {
    streak = 0;
  } else if (inZone && timingQuality > 0.15) {
    // Calculate distance based on timing
    const baseDist = 320 + timingQuality * 180; // 320 to 500
    const dist = Math.round(baseDist + (Math.random() - 0.4) * 30);
    const isHR = dist >= 380 || timingQuality > 0.75;

    if (isHR) {
      hrs++;
      streak++;
      lastDist = dist;
      logMsg('HOME RUN! ' + dist + ' ft');
    } else {
      streak = 0;
      lastDist = 0;
      logMsg(dist > 340 ? 'Deep fly (' + dist + ' ft)' : 'Contact');
    }

    // fly ball animation
    anim.hit = {
      x: canvas.width / 2,
      y: canvas.height - 65,
      vx: (Math.random() - 0.5) * 5,
      vy: -7 - timingQuality * 5
    };
    let f = 0;
    const fly = () => {
      if (!anim.hit) return;
      anim.hit.x += anim.hit.vx;
      anim.hit.y += anim.hit.vy;
      anim.hit.vy += 0.26;
      f++;
      draw();
      if (f < 55 && anim.hit.y < canvas.height + 30) requestAnimationFrame(fly);
      else anim.hit = null;
    };
    fly();
  } else {
    streak = 0;
    logMsg('Swing and a miss!');
  }

  // CHANGE PITCHER COLOR FOR NEXT PITCH NOW
  nextPitchType = pickPitch();
  updateNextPitchDisplay();

  anim.ball = null;
  updateScore();
  setTimeout(() => {
    phase = 'idle';
    hint.textContent = 'TAP TO PITCH';
    draw();
  }, 700);
}

function logMsg(msg) {
  const old = hint.textContent;
  hint.textContent = msg;
  setTimeout(() => { if (phase !== 'idle') hint.textContent = old; }, 900);
}

function resetGame() {
  hrs = 0;
  pitches = 0;
  streak = 0;
  lastDist = 0;
  phase = 'idle';
  nextPitchType = pickPitch();
  anim = { arm: 0, swing: 0, ball: null, hit: null };
  if (animId) cancelAnimationFrame(animId);
  updateNextPitchDisplay();
  updateScore();
  hint.textContent = 'TAP TO PITCH';
  draw();
}

// init
nextPitchType = pickPitch();
updateNextPitchDisplay();
updateScore();
draw();
</script>
</body>
</html>

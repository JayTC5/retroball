<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b3d2e">
  <title>Retroball Club</title>
  <style>
    :root { --ink:#10281e; --cream:#f5edcf; --gold:#f4c95d; --green:#176b46; --red:#c84a46; --blue:#3266a8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#071711; color:var(--ink); font-family:"Courier New", monospace; image-rendering:pixelated; }
    button { font-family:inherit; cursor:pointer; }
    .app { max-width:1180px; min-height:100vh; margin:auto; background:var(--cream); border-inline:8px solid #1a2c22; }
    header { height:82px; display:flex; align-items:center; justify-content:space-between; padding:12px 22px; background:var(--green); color:white; border-bottom:8px solid var(--gold); }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { width:54px; height:54px; display:grid; place-items:center; background:var(--cream); color:var(--green); border:4px solid #fff; border-radius:50%; font-size:30px; }
    h1 { margin:0; font-size:26px; text-transform:uppercase; letter-spacing:2px; }
    .coins { background:#09291d; border:3px solid #fff; padding:10px 14px; font-size:18px; }
    nav { display:flex; background:#10281e; padding:8px; gap:6px; }
    nav button { flex:1; padding:12px; border:0; background:#31523f; color:#f8f2dc; text-transform:uppercase; font-weight:bold; }
    nav button.active { background:var(--gold); color:#10281e; box-shadow:inset 0 -5px #ae7d26; }
    main { padding:18px; }
    .view { display:none; }
    .view.active { display:block; }
    .panel { border:4px solid var(--ink); background:#fffbe9; box-shadow:7px 7px 0 #b8ad85; }
    .panel-title { background:var(--ink); color:white; padding:9px 12px; font-weight:bold; text-transform:uppercase; }

    /* Roster */
    .roster-layout { display:grid; grid-template-columns:1fr 260px; gap:16px; }
    .players { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:12px; }
    .player-card { position:relative; min-height:205px; border:4px solid var(--ink); background:#f9f2da; padding:8px; text-align:center; box-shadow:4px 4px #b3aa86; }
    .player-card.legendary { background:#5a3e8a; color:white; }
    .player-card.epic { background:#9270be; }
    .player-card.rare { background:#70a8d6; }
    .player-card.common { background:#ddd7bd; }
    .portrait { height:92px; display:grid; place-items:center; font-size:60px; filter:drop-shadow(3px 3px 0 rgba(0,0,0,.2)); }
    .player-name { font-weight:bold; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rating { margin:7px auto; width:48px; height:48px; border-radius:50%; background:var(--gold); color:var(--ink); border:3px solid var(--ink); display:grid; place-items:center; font-size:20px; font-weight:bold; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); font-size:11px; }
    .stats b { display:block; font-size:14px; }
    .lineup { padding:12px; }
    .line-slot { display:flex; justify-content:space-between; align-items:center; padding:9px 5px; border-bottom:2px dashed #9a9271; }

    /* Packs */
    .packs { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding:24px; }
    .pack { border:5px solid var(--ink); min-height:390px; background:#d8cfaa; text-align:center; padding:16px; box-shadow:8px 8px #aaa276; transition:.12s; }
    .pack:hover { transform:translate(-2px,-2px); box-shadow:10px 10px #aaa276; }
    .pack-art { height:220px; display:grid; place-items:center; font-size:112px; border:4px solid var(--ink); background:#f3e9c4; margin-bottom:12px; }
    .pack.pro .pack-art { background:#cfb7eb; }
    .pack.legend .pack-art { background:#e5b74d; }
    .pack h3 { margin:8px 0; text-transform:uppercase; }
    .open-btn { width:100%; padding:12px; border:3px solid var(--ink); background:var(--green); color:white; font-weight:bold; font-size:16px; box-shadow:0 5px #09291d; }
    .open-btn:active { transform:translateY(4px); box-shadow:0 1px #09291d; }

    /* Reveal */
    .reveal { position:fixed; inset:0; z-index:20; background:rgba(7,23,17,.92); display:none; place-items:center; }
    .reveal.show { display:grid; }
    .reveal-card { width:min(330px,86vw); min-height:430px; border:8px solid #fff4; outline:5px solid var(--ink); padding:16px; text-align:center; animation:flip .7s ease-out; }
    .reveal-card.common { background:#ddd7bd; }.reveal-card.rare { background:#70a8d6; }.reveal-card.epic { background:#9270be; }.reveal-card.legendary { background:#5a3e8a; color:white; }
    @keyframes flip { 0%{transform:rotateY(90deg) scale(.7)} 100%{transform:rotateY(0) scale(1)} }
    .reveal-card .portrait { height:150px; font-size:100px; }
    .reveal-card h2 { margin:8px 0 2px; }.reveal-card .rating { width:68px;height:68px;font-size:28px;margin:12px auto; }

    /* Game */
    .game-layout { display:grid; grid-template-columns:1fr 310px; gap:16px; }
    .field { height:440px; position:relative; overflow:hidden; background:#d9bd75; border:4px solid var(--ink); }
    .diamond { position:absolute; width:290px;height:290px; left:50%; bottom:-190px; transform:translateX(-50%) rotate(45deg); border:8px solid #fff9; background:#bda36c; }
    .pitcher { position:absolute; left:50%; bottom:170px; width:20px;height:20px; border-radius:50%; background:#fff; border:3px solid var(--ink); transform:translateX(-50%); }
    .batter { position:absolute; left:50%; bottom:76px; transform:translateX(-50%); font-size:55px; }
    .ball { position:absolute; width:14px;height:14px; border-radius:50%; background:white; border:2px solid var(--ink); display:none; }
    .strike-zone { position:absolute; left:calc(50% - 52px); bottom:118px; width:104px;height:82px; border:3px dashed rgba(255,255,255,.8); }
    .scoreboard { display:grid; grid-template-columns:repeat(3,1fr); text-align:center; background:var(--ink); color:white; font-size:18px; }
    .scoreboard div { padding:9px; border-right:2px solid #fff3; }
    .game-controls { padding:14px; }
    .game-controls button { width:100%; margin:7px 0; padding:13px; border:3px solid var(--ink); background:var(--gold); color:var(--ink); font-weight:bold; font-size:16px; }
    #gameLog { height:205px; overflow:auto; border:3px solid var(--ink); background:#fffbe9; padding:8px; font-size:13px; }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--ink); color:white; border:3px solid var(--gold); padding:12px 18px; transition:.25s; z-index:30; }
    .toast.show { transform:translateX(-50%) translateY(0); }
    @media (max-width:800px) { .roster-layout,.game-layout{grid-template-columns:1fr}.players{grid-template-columns:repeat(2,1fr)}.packs{grid-template-columns:1fr}.lineup{display:none}.field{height:380px}.app{border:0} }
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand"><div class="brand-mark">⚾</div><h1>Retroball Club</h1></div><div class="coins">$ <span id="coins">500</span></div></header>
  <nav><button class="active" data-view="packs">Packs</button><button data-view="roster">Roster</button><button data-view="game">Play Ball</button></nav>
  <main>
    <section id="packs" class="view active">
      <div class="panel"><div class="panel-title">Player Packs</div><div class="packs" id="packGrid"></div></div>
    </section>
    <section id="roster" class="view"><div class="roster-layout"><div class="panel"><div class="panel-title">My Players</div><div class="players" id="players"></div></div><div class="panel"><div class="panel-title">Club Rating</div><div class="lineup" id="lineup"></div></div></div></section>
    <section id="game" class="view"><div class="game-layout"><div class="panel"><div class="scoreboard"><div>INN <b id="inning">1</b></div><div>OUT <b id="outs">0</b></div><div>RUNS <b id="runs">0</b></div></div><div class="field"><div class="diamond"></div><div class="pitcher"></div><div class="strike-zone"></div><div class="batter">🏃</div><div class="ball" id="ball"></div></div></div><div class="panel"><div class="panel-title">At Bat</div><div class="game-controls"><div id="gameLog">The umpire calls: “Play ball!”</div><button id="swing">SWING!</button><button id="take">TAKE PITCH</button></div></div></div></section>
  </main>
</div>
<div class="reveal" id="reveal"><div class="reveal-card common" id="revealCard"></div></div>
<div class="toast" id="toast"></div>
<script>
const names=['Ace Walker','Billy Bunts','Carlos Vega','Duke Davis','Eddie Flash','Frank Flint','Gus Green','Harry Horn','Ivy Jones','Jack Slugger','Leo Long','Manny Mound','Nate Nitro','Otto Oak','Pete Power','Ray Rocket','Sam Slam','Tex Turner','Vic Velocity','Will Wright','Zane Zip','Bobby Barrels','Chuck Curve','Danny Dinger'];
const emoji=['🏃','🧢','🏃‍♂️','🤾','🏃‍♀️','🧔','👨‍🦰','👱','🧑','👨‍🦱'];
let coins=500;
let roster=[makePlayer('common',4),makePlayer('common',3),makePlayer('rare',1)];
const packs=[
 {key:'rookie',name:'Rookie Pack',price:100,art:'🎟️',legend:0.02,epic:.08,rare:.28},
 {key:'pro',name:'Pro Pack',price:250,art:'📦',legend:.06,epic:.18,rare:.46},
 {key:'legend',name:'Legend Pack',price:500,art:'🏆',legend:.15,epic:.32,rare:.53}
];
function makePlayer(forcedTier,startRating){
 const roll=Math.random(); let tier=forcedTier||'common';
 if(!forcedTier){ if(roll<.05)tier='legendary'; else if(roll<.20)tier='epic'; else if(roll<.45)tier='rare'; }
 const base=tier==='legendary'?82:tier==='epic'?68:tier==='rare'?55:40;
 const variance=startRating?startRating*4:18;
 const rating=Math.min(99,base+Math.floor(Math.random()*variance));
 const pos=['P','C','1B','2B','3B','SS','LF','CF','RF'][Math.floor(Math.random()*9)];
 return {name:names[Math.floor(Math.random()*names.length)],tier,rating,pos,emoji:emoji[Math.floor(Math.random()*emoji.length)],power:Math.min(99,rating-Math.floor(Math.random()*12)),contact:Math.min(99,rating-Math.floor(Math.random()*10)),speed:Math.min(99,rating-Math.floor(Math.random()*15))};
}
function packPlayer(p){ const r=Math.random(); if(r<p.legend)return makePlayer('legendary'); if(r<p.legend+p.epic)return makePlayer('epic'); if(r<p.legend+p.epic+(p.rare-p.legend-p.epic))return makePlayer('rare'); return makePlayer('common'); }
function renderPacks(){document.getElementById('packGrid').innerHTML=packs.map(p=>`<div class="pack ${p.key}"><div class="pack-art">${p.art}</div><h3>${p.name}</h3><p>1–3 hidden attributes</p><button class="open-btn" data-pack="${p.key}">$${p.price} · OPEN</button></div>`).join('');}
function card(p,small=false){return `<div class="player-card ${p.tier}"><div class="portrait">${p.emoji}</div><div class="player-name">${p.name}</div><div class="rating">${p.rating}</div><div class="stats"><span>POW<b>${p.power}</b></span><span>CON<b>${p.contact}</b></span><span>SPD<b>${p.speed}</b></span></div></div>`}
function renderRoster(){document.getElementById('players').innerHTML=roster.slice().reverse().map(p=>card(p)).join('');let avg=Math.round(roster.reduce((a,p)=>a+p.rating,0)/roster.length);document.getElementById('lineup').innerHTML=`<div style="text-align:center"><div class="rating" style="width:80px;height:80px;font-size:32px">${avg}</div><b>TEAM OVR</b></div>`+roster.slice(0,9).map(p=>`<div class="line-slot"><b>${p.pos}</b><span>${p.name}</span><b>${p.rating}</b></div>`).join('');}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
document.getElementById('packGrid').addEventListener('click',e=>{const b=e.target.closest('[data-pack]');if(!b)return;const p=packs.find(x=>x.key===b.dataset.pack);if(coins<p.price){toast('Not enough coins!');return}coins-=p.price;document.getElementById('coins').textContent=coins;const player=packPlayer(p);roster.push(player);renderRoster();const r=document.getElementById('revealCard');r.className=`reveal-card ${player.tier}`;r.innerHTML=`<div style="text-transform:uppercase;font-weight:bold">${player.tier} ${player.pos}</div><div class="portrait">${player.emoji}</div><h2>${player.name}</h2><div class="rating">${player.rating}</div><div class="stats"><span>POW<b>${player.power}</b></span><span>CON<b>${player.contact}</b></span><span>SPD<b>${player.speed}</b></span></div><button class="open-btn" id="keepCard">ADD TO ROSTER</button>`;document.getElementById('reveal').classList.add('show');});
document.getElementById('reveal').addEventListener('click',e=>{if(e.target.id==='keepCard'||e.target===e.currentTarget)e.currentTarget.classList.remove('show')});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forAll?.();document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(b.dataset.view).classList.add('active')});
let outs=0,runs=0,inning=1;
function pitch(){const ball=document.getElementById('ball');ball.style.cssText='display:block;left:50%;bottom:118px';ball.animate([{left:'50%',bottom:'118px'},{left:(42+Math.random()*16)+'%',bottom:'220px'}],{duration:850,fill:'forwards'}).finished.then(()=>{ball.style.display='none'});}
function outcome(swing){const batter=roster.sort((a,b)=>b.contact-a.contact)[0];const chance=batter.contact/100;const inZone=Math.random()<.72;if(!swing&&!inZone){log('Ball!');return}if(!swing){outs++;log('Called strike!');finishOut();return}if(Math.random()<chance*(inZone?1:.45)){const hit=Math.random();if(hit>.92){runs+=2;log('HOME RUN! +2 runs');pitchBonus(40)}else if(hit>.72){runs+=1;log('Clean single! +1 run');pitchBonus(15)}else if(hit>.42){log('Foul ball!');return}else log('Ground out');finishOut()}else{log('Swing and a miss!');outs++;finishOut()}}
function finishOut(){if(outs>=3){outs=0;inning++;log(`End of inning ${inning-1}!`);coins+=25;document.getElementById('coins').textContent=coins}updateGame()}
function pitchBonus(n){coins+=n;document.getElementById('coins').textContent=coins;updateGame()}
function log(t){const l=document.getElementById('gameLog');l.innerHTML+=`<br><b>${t}</b>`;l.scrollTop=l.scrollHeight}
function updateGame(){document.getElementById('outs').textContent=outs;document.getElementById('runs').textContent=runs;document.getElementById('inning').textContent=inning}
document.getElementById('swing').onclick=()=>{pitch();setTimeout(()=>outcome(true),820)};
document.getElementById('take').onclick=()=>{pitch();setTimeout(()=>outcome(false),820)};
renderPacks();renderRoster();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RETROBALL Derby</title>
<style>
* { box-sizing: border-box; image-rendering: pixelated; }
body {
  margin: 0;
  min-height: 100vh;
  background: #06140f;
  color: #f8f0d0;
  font-family: "Courier New", monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
h1 { margin: 8px 0; font-size: 28px; letter-spacing: 3px; color: #f4c430; }
.scoreboard {
  display: flex;
  gap: 20px;
  background: #0d3d26;
  border: 4px solid #f4c430;
  padding: 10px 20px;
  margin-bottom: 8px;
  font-size: 16px;
}
.scoreboard b { color: #f4c430; font-size: 22px; }
.field-wrap {
  position: relative;
  border: 6px solid #1a2c22;
  background: #2d5a3a;
  cursor: pointer;
  box-shadow: 0 0 0 4px #f4c430;
}
canvas { display: block; }
.tap-hint {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 8px 16px;
  font-size: 16px;
  font-weight: bold;
  border: 3px solid #f4c430;
  pointer-events: none;
}
.info {
  margin-top: 10px;
  text-align: center;
  font-size: 14px;
  max-width: 640px;
}
.pitch-legend {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 8px;
  flex-wrap: wrap;
  font-size: 13px;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.swatch { width: 16px; height: 16px; border: 2px solid #fff; }
button {
  margin-top: 10px;
  padding: 10px 20px;
  background: #f4c430;
  color: #0a1f16;
  font-weight: bold;
  font-size: 16px;
  border: 3px solid #0a1f16;
  cursor: pointer;
  font-family: inherit;
}
button:active { transform: translateY(2px); }
</style>
</head>
<body>
<h1>RETROBALL DERBY</h1>
<div class="scoreboard">
  <div>HOME RUNS<br><b id="hrs">0</b></div>
  <div>PITCHES<br><b id="pitches">0</b></div>
  <div>BEST<br><b id="best">0</b></div>
  <div>STREAK<br><b id="streak">0</b></div>
</div>
<div class="field-wrap" id="fieldWrap">
  <canvas id="c" width="640" height="420"></canvas>
  <div class="tap-hint" id="hint">TAP TO PITCH</div>
</div>
<div class="info">
  Tap the field to pitch, then tap again to swing.<br>
  Time it right and crush it!
</div>
<div class="pitch-legend">
  <div class="legend-item"><div class="swatch" style="background:#eee;"></div> White: Normal</div>
  <div class="legend-item"><div class="swatch" style="background:#e33;"></div> Red: SUPER FAST</div>
  <div class="legend-item"><div class="swatch" style="background:#39f;"></div> Blue: Loop ball</div>
  <div class="legend-item"><div class="swatch" style="background:#fc0;"></div> Yellow: Slider</div>
  <div class="legend-item"><div class="swatch" style="background:linear-gradient(90deg,#f33,#f93,#ff3,#3f3,#39f,#93f);"></div> Rainbow: ANYTHING</div>
</div>
<button onclick="resetGame()">RESET</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');

let hrs = 0, pitches = 0, best = parseInt(localStorage.getItem('retroball-best')||0), streak = 0;
let phase = 'idle'; // idle | pitching | resolving
let pitchType = 'white';
let anim = { arm: 0, swing: 0, ball: null, hit: null };
let animId = null;

const PITCHES = {
  white:  { name: 'Normal',     color: '#eeeeee', speed: 1.0, curve: 0,   loop: 0 },
  red:    { name: 'SUPER FAST', color: '#ee3333', speed: 1.85, curve: 0,   loop: 0 },
  blue:   { name: 'Loop ball',  color: '#3399ff', speed: 0.75, curve: 0,   loop: 1 },
  yellow: { name: 'Slider',     color: '#ffcc00', speed: 1.1,  curve: 1.4, loop: 0 },
  rainbow:{ name: 'ANYTHING',   color: 'rainbow', speed: 1.3,  curve: 0.8, loop: 0.5 }
};

function pickPitch() {
  const r = Math.random();
  if (r < 0.35) return 'white';
  if (r < 0.55) return 'red';
  if (r < 0.75) return 'blue';
  if (r < 0.90) return 'yellow';
  return 'rainbow';
}

function updateScore() {
  document.getElementById('hrs').textContent = hrs;
  document.getElementById('pitches').textContent = pitches;
  document.getElementById('best').textContent = best;
  document.getElementById('streak').textContent = streak;
  if (hrs > best) {
    best = hrs;
    localStorage.setItem('retroball-best', best);
  }
}

function drawPixel(x, y, color, arm, isPitcher) {
  // body
  if (isPitcher && color === 'rainbow') {
    const grd = ctx.createLinearGradient(x-8, y-20, x+8, y+10);
    grd.addColorStop(0, '#f33');
    grd.addColorStop(0.25, '#f93');
    grd.addColorStop(0.5, '#ff3');
    grd.addColorStop(0.75, '#3f3');
    grd.addColorStop(1, '#39f');
    ctx.fillStyle = grd;
  } else {
    ctx.fillStyle = isPitcher ? color : '#c84a46';
  }
  ctx.fillRect(x - 7, y - 18, 14, 20);
  // head
  ctx.fillStyle = '#f4c28a';
  ctx.fillRect(x - 6, y - 28, 12, 11);
  // cap
  ctx.fillStyle = isPitcher ? '#222' : '#a33';
  ctx.fillRect(x - 7, y - 30, 14, 4);
  // arm / bat
  ctx.strokeStyle = isPitcher ? '#222' : '#8b4513';
  ctx.lineWidth = isPitcher ? 3 : 5;
  ctx.beginPath();
  ctx.moveTo(x + (isPitcher ? 7 : -7), y - 12);
  const ang = isPitcher ? (arm * Math.PI * 1.2 - 1) : (-1.2 + arm * 2.6);
  const len = isPitcher ? 16 : 20;
  ctx.lineTo(x + Math.cos(ang) * len, y - 10 + Math.sin(ang) * 12);
  ctx.stroke();
}

function draw() {
  const w = canvas.width, h = canvas.height;
  // field
  ctx.fillStyle = '#2d5a3a';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#266b40';
  for (let y = 0; y < h; y += 14) ctx.fillRect(0, y, w, 7);
  // dirt
  ctx.fillStyle = '#8b6914';
  ctx.beginPath();
  ctx.moveTo(w/2, h - 10);
  ctx.lineTo(w/2 - 140, h/2 + 40);
  ctx.lineTo(w/2, 80);
  ctx.lineTo(w/2 + 140, h/2 + 40);
  ctx.closePath();
  ctx.fill();
  // bases
  ctx.fillStyle = '#fff';
  [[w/2, h-40], [w/2-110, h/2+20], [w/2, 110], [w/2+110, h/2+20]].forEach(([x,y]) => {
    ctx.fillRect(x-8, y-8, 16, 16);
  });
  // mound
  ctx.fillStyle = '#a67c52';
  ctx.beginPath();
  ctx.arc(w/2, h/2 + 20, 18, 0, Math.PI*2);
  ctx.fill();
  // home
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeRect(w/2-30, h-80, 60, 35);

  // pitcher
  const pColor = PITCHES[pitchType].color;
  drawPixel(w/2, h/2 + 10, pColor, anim.arm, true);

  // batter
  drawPixel(w/2 + 22, h - 60, '#c84a46', anim.swing, false);

  // ball
  if (anim.ball) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(anim.ball.x, anim.ball.y, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  if (anim.hit) {
    ctx.fillStyle = '#ff0';
    ctx.beginPath();
    ctx.arc(anim.hit.x, anim.hit.y, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.stroke();
  }

  // crowd
  ctx.fillStyle = '#1a3a28';
  ctx.fillRect(0, 0, w, 36);
  for (let i = 0; i < 70; i++) {
    ctx.fillStyle = ['#e44','#4ae','#fe4','#fff','#a4e'][i%5];
    ctx.fillRect((i * 9) % w, 6 + (i % 4) * 6, 3, 3);
  }

  // pitch type label
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px Courier New';
  ctx.textAlign = 'center';
  const label = PITCHES[pitchType].name;
  ctx.fillText(label, w/2, 55);
}

function onTap() {
  if (phase === 'idle') startPitch();
  else if (phase === 'pitching') swing();
}

canvas.onclick = onTap;
document.getElementById('fieldWrap').onclick = (e) => {
  if (e.target === canvas) return;
  onTap();
};

function startPitch() {
  if (phase !== 'idle') return;
  phase = 'pitching';
  pitches++;
  pitchType = pickPitch();
  const p = PITCHES[pitchType];
  anim.arm = 0;
  anim.swing = 0;
  anim.ball = {
    x: canvas.width / 2,
    y: canvas.height / 2 + 10,
    baseY: canvas.height / 2 + 10,
    speed: 3.2 * p.speed,
    curve: p.curve,
    loop: p.loop,
    t: 0
  };
  anim.hit = null;
  hint.textContent = 'TAP TO SWING!';
  updateScore();
  animate();
}

function animate() {
  if (phase !== 'pitching') return;
  anim.arm = Math.min(1, anim.arm + 0.07);
  if (anim.ball) {
    const b = anim.ball;
    b.t += 1;
    b.y += b.speed;
    b.speed += 0.08;
    // curve / slider
    if (b.curve) b.x += Math.sin(b.t * 0.15) * b.curve * 1.8;
    // loop
    if (b.loop) b.y += Math.sin(b.t * 0.25) * b.loop * 6;
    // rainbow chaos
    if (pitchType === 'rainbow') {
      b.x += (Math.random() - 0.5) * 4;
      b.speed += (Math.random() - 0.5) * 0.4;
    }
  }
  draw();
  if (anim.ball && anim.ball.y < canvas.height - 70) {
    animId = requestAnimationFrame(animate);
  } else if (phase === 'pitching') {
    setTimeout(() => { if (phase === 'pitching') resolve(false); }, 120);
  }
}

function swing() {
  if (phase !== 'pitching') return;
  resolve(true);
}

function resolve(swung) {
  if (phase !== 'pitching') return;
  phase = 'resolving';
  if (animId) cancelAnimationFrame(animId);

  if (swung) {
    anim.swing = 0;
    let s = 0;
    const doSwing = () => {
      s++;
      anim.swing = Math.min(1, s * 0.18);
      draw();
      if (s < 7) requestAnimationFrame(doSwing);
    };
    doSwing();
  }

  const p = PITCHES[pitchType];
  const inZone = Math.random() < (pitchType === 'rainbow' ? 0.5 : 0.68);
  const timing = swung && anim.ball && anim.ball.y > 280 && anim.ball.y < 360;

  if (!swung) {
    // miss / take
    streak = 0;
  } else if (inZone && (timing || Math.random() < 0.55)) {
    // hit!
    const power = 0.6 + Math.random() * 0.5 + (timing ? 0.25 : 0);
    const isHR = power > 0.95 || (timing && Math.random() < 0.45);
    if (isHR) {
      hrs++;
      streak++;
      logMsg('HOME RUN!!!');
    } else {
      streak = 0;
      logMsg(power > 0.7 ? 'Deep fly!' : 'Contact!');
    }
    // hit ball fly
    anim.hit = {
      x: canvas.width / 2,
      y: canvas.height - 60,
      vx: (Math.random() - 0.5) * 6,
      vy: -8 - power * 4
    };
    let f = 0;
    const fly = () => {
      if (!anim.hit) return;
      anim.hit.x += anim.hit.vx;
      anim.hit.y += anim.hit.vy;
      anim.hit.vy += 0.28;
      f++;
      draw();
      if (f < 50 && anim.hit.y < canvas.height + 20) requestAnimationFrame(fly);
      else anim.hit = null;
    };
    fly();
  } else {
    streak = 0;
    logMsg('Swing and a miss!');
  }

  anim.ball = null;
  updateScore();
  setTimeout(() => {
    phase = 'idle';
    hint.textContent = 'TAP TO PITCH';
    draw();
  }, 600);
}

function logMsg(msg) {
  // quick flash in hint
  const old = hint.textContent;
  hint.textContent = msg;
  setTimeout(() => { if (phase !== 'idle') hint.textContent = old; }, 800);
}

function resetGame() {
  hrs = 0;
  pitches = 0;
  streak = 0;
  phase = 'idle';
  anim = { arm: 0, swing: 0, ball: null, hit: null };
  if (animId) cancelAnimationFrame(animId);
  updateScore();
  hint.textContent = 'TAP TO PITCH';
  draw();
}

// init
pitchType = 'white';
updateScore();
draw();
</script>
</body>
</html>
